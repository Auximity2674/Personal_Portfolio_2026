<!doctype html>
<!-- Source for assets/img/og.png (1200x630 social share card). See README.md. -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=block">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{background:#060709;color:#F3F4F6;font-family:Archivo,Arial,sans-serif;position:relative}
  body::before{content:"";position:absolute;inset:0;background:radial-gradient(40% 60% at 78% 20%,rgba(124,196,255,.12),transparent 70%)}
  .c{position:absolute;width:32px;height:32px;border:0 solid rgba(255,255,255,.25)}
  .c1{left:28px;top:28px;border-width:1px 0 0 1px}.c2{right:28px;top:28px;border-width:1px 1px 0 0}
  .c3{left:28px;bottom:28px;border-width:0 0 1px 1px}.c4{right:28px;bottom:28px;border-width:0 1px 1px 0}
  .wrap{position:absolute;left:84px;bottom:120px;z-index:2}
  h1{margin:0;font-size:132px;line-height:.92;font-weight:300;font-stretch:112%;letter-spacing:-.035em;
     background:linear-gradient(180deg,#fff 0%,#E2E5E9 34%,#8E949D 60%,#D6DADF 82%,#F5F6F8 100%);-webkit-background-clip:text;color:transparent}
  .sub{margin-top:26px;padding-top:16px;border-top:1px solid rgba(255,255,255,.2);font-size:28px;color:#C7CCD3;width:560px}
  .ph{position:absolute;right:40px;top:10px;width:620px;height:620px}
  .ph img{width:100%;height:100%;object-fit:cover;
    -webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 13%,#000 62%,transparent 97%),linear-gradient(to right,transparent 2%,#000 18%,#000 84%,transparent 98%);
    -webkit-mask-composite:source-in}
  .box{position:absolute;inset:14% 15% 3% 23%;border:1px solid #7CC4FF}
  .lbl{position:absolute;left:-1px;bottom:100%;background:#7CC4FF;color:#041019;font-size:18px;line-height:1;font-weight:650;font-stretch:80%;padding:6px 10px 5px}
</style></head>
<body>
  <i class="c c1"></i><i class="c c2"></i><i class="c c3"></i><i class="c c4"></i>
  <div class="ph"><img src="../assets/img/portrait.webp" alt=""><span class="box"><span class="lbl">person 0.98</span></span></div>
  <div class="wrap">
    <h1>Arsyad<br>Rizantha</h1>
    <p class="sub">Information Technology Graduate Portfolio</p>
  </div>
</body></html>
